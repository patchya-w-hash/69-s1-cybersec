services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54326:5432"
    environment:
      - POSTGRES_PASSWORD="12345678"
      - POSTGRES_USER=patchya
      - POSTGRES_DB=patchya
    volumes:
      - ./data:/var/lib/postgresql/data

      admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    environment:
      - PGADMIN_DEFAULT_EMAIL=patchya@rmutp.ac.th # อีเมลสำหรับล็อกอินหน้าเว็บ 
      - PGADMIN_DEFAULT_PASSWORD=12345678   # รหัสผ่านสำหรับล็อกอินหน้าเว็บ 
    ports:
      - "8081:80"                                 # เปิดใช้งานผ่าน 
    depends_on:
      - db                                        # สั่งให้รันตัว db ให้เสร็จก่อนรัน admin
