version: '3.8'

services:
  69-s2-db:
    image: postgres:14-alpine
    container_name: 69-s2-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always

  69-s2-admin:
    image: adminer
    container_name: 69-s2-admin
    ports:
      - "8080:8080"
    restart: always

  69-s2-app:
    image: prawee/strapi
    container_name: 69-s2-app
    ports:
      - "9092:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: 69-s2-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
